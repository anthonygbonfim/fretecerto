<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FreteCerto: planejador financeiro com IA para caminhoneiros autônomos." />
    <meta name="theme-color" content="#16181d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>FreteCerto · Planejador financeiro do caminhoneiro</title>
    <script>
      // Aplica o tema salvo antes do React carregar, para não "piscar" a tela.
      (function () {
        try {
          var salvo = JSON.parse(localStorage.getItem('fretecerto:tema') || 'null');
          if (salvo !== 'claro') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
